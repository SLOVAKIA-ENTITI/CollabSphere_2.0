<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prihlásenie | CollabSphere</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .login-container {
            display: flex;
            width: 900px;
            height: 600px;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        }
        .login-sidebar {
            flex: 1;
            background: #6366f1;
            padding: 3rem;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .login-sidebar::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -100px;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }
        .login-form-container {
            flex: 1;
            padding: 4rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .brand {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .form-control {
            padding: 0.75rem 1rem;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
        }
        .form-control:focus {
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            border-color: #6366f1;
        }
        .btn-primary {
            background: #6366f1;
            border: none;
            padding: 0.75rem;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-primary:hover {
            background: #4f46e5;
            transform: translateY(-1px);
        }
        @media (max-width: 992px) {
            .login-container {
                width: 450px;
                height: auto;
            }
            .login-sidebar {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-sidebar">
            <div class="brand">
                <i class="bi bi-layers-fill"></i>
                <span>CollabSphere</span>
            </div>
            <h2 class="fw-bold mb-4">Vitajte späť!</h2>
            <p class="opacity-75 mb-0">Zefektívnite svoju tímovú spoluprácu a spravujte projekty s ľahkosťou na jednom mieste.</p>
        </div>
        <div class="login-form-container">
            <div class="mb-5">
                <h3 class="fw-bold text-dark mb-2">Prihlásenie</h3>
                <p class="text-muted">Zadajte svoje údaje pre prístup k účtu</p>
            </div>

            {% if form.errors %}
            <div class="alert alert-danger border-0 rounded-4 small mb-4">
                <i class="bi bi-exclamation-circle-fill me-2"></i> Nesprávne meno alebo heslo.
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-bold text-muted">Používateľské meno</label>
                    <input type="text" name="username" class="form-control" placeholder="napr. janko_mrkvicka" required autofocus>
                </div>
                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <label class="form-label small fw-bold text-muted">Heslo</label>
                    </div>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-4">
                    Prihlásiť sa
                </button>
            </form>
            
            <div class="text-center mt-auto">
                <p class="small text-muted mb-0">© 2026 CollabSphere. Všetky práva vyhradené.</p>
            </div>
        </div>
    </div>
</body>
</html>
